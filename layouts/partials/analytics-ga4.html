{{ $measurementID := .Site.Config.Services.GoogleAnalytics.ID }}
{{ if and .Site.Params.analytics.enabled (eq .Site.Params.analytics.provider "ga4") $measurementID }}
<script>
(function () {
  var consentKey = "site_analytics_consent";
  var measurementId = {{ $measurementID }};
  var disableKey = "ga-disable-" + measurementId;
  var consentRequired = {{ .Site.Params.analytics.consent_required }};
  var loaded = false;

  function getStoredConsent() {
    try {
      return window.localStorage.getItem(consentKey);
    } catch (error) {
      return null;
    }
  }

  function loadAnalytics() {
    window[disableKey] = false;
    if (loaded || !measurementId) {
      return;
    }

    loaded = true;

    var script = document.createElement("script");
    script.async = true;
    script.src = "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(measurementId);
    document.head.appendChild(script);

    window.dataLayer = window.dataLayer || [];
    window.gtag = function () {
      window.dataLayer.push(arguments);
    };

    window.gtag("js", new Date());
    window.gtag("config", measurementId);
  }

  if (!consentRequired || getStoredConsent() === "accepted") {
    loadAnalytics();
  }

  window.addEventListener("analytics:consent-granted", loadAnalytics);
  window.addEventListener("analytics:consent-declined", function () {
    window[disableKey] = true;
  });
})();
</script>
{{ end }}
