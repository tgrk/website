{{ if and .Site.Params.analytics.enabled .Site.Params.analytics.consent_required }}
<div id="cookie-consent" class="cookie-consent" role="group" aria-labelledby="cookie-consent-description" hidden>
  <p id="cookie-consent-description">This site uses optional Google Analytics to understand site usage.</p>
  <div class="cookie-consent-actions">
    <button type="button" class="button" data-consent-action="accept">Accept analytics</button>
    <button type="button" class="button" data-consent-action="decline">Decline analytics</button>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var consentKey = "site_analytics_consent";
  var banner = document.getElementById("cookie-consent");
  var cookieSettingsLink = document.getElementById("cookie-settings-link");

  if (!banner) {
    return;
  }

  function getStoredConsent() {
    try {
      return window.localStorage.getItem(consentKey);
    } catch (error) {
      return null;
    }
  }

  function setStoredConsent(value) {
    try {
      window.localStorage.setItem(consentKey, value);
    } catch (error) {
      // Ignore storage failures and continue with runtime behavior.
    }
  }

  function showBanner() {
    banner.hidden = false;
    cookieSettingsLink.setAttribute("aria-expanded", "true");
  }

  function hideBanner() {
    banner.hidden = true;
    cookieSettingsLink.setAttribute("aria-expanded", "false");
    cookieSettingsLink.focus();
  }

  function grantConsent() {
    setStoredConsent("accepted");
    window.dispatchEvent(new Event("analytics:consent-granted"));
    hideBanner();
  }

  function declineConsent() {
    setStoredConsent("declined");
    window.dispatchEvent(new Event("analytics:consent-declined"));
    hideBanner();
  }

  if (getStoredConsent() !== "accepted" && getStoredConsent() !== "declined") {
    showBanner();
  }

  banner.addEventListener("click", function (event) {
    var target = event.target && event.target.closest("[data-consent-action]");
    var action = target && target.getAttribute("data-consent-action");

    if (action === "accept") {
      grantConsent();
      return;
    }

    if (action === "decline") {
      declineConsent();
    }
  });

  cookieSettingsLink.addEventListener("click", function () {
    showBanner();
    banner.querySelector("button").focus();
  });
});
</script>
{{ end }}
