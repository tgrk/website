{{ define "main" }}

{{ partial "site-nav" . }}

<main class="wrapper style1 align-left" id="main" tabindex="-1">
    <div class="inner">
        <h1>{{ .Title }}</h1>
        <p>{{ .Data.Singular | humanize }}</p>
        <p><a href="/post/">All posts</a></p>
        <div class="content align-left">
            {{ if .Pages }}
            <ol class="post-list">
                {{ range .Pages }}{{ partial "post-row" . }}{{ end }}
            </ol>
            {{ end }}
        </div>
    </div>
</main>

{{ partial "footer" . }}

{{ end }}
