{{ define "main" }}

{{ partial "site-nav" . }}

<main class="wrapper style1 align-left" id="main" tabindex="-1">
    <div class="inner">
        <h1>{{ .Title }}</h1>
        <div class="content align-left">
            {{ .Content }}
            
            {{ with hugo.Data.projects }}

            {{ end }}
        </div>
    </div>
</main>

{{ partial "footer" . }}

{{ end }}
