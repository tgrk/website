## -----------------------------------------------
## Basic Configuration
## -----------------------------------------------

theme = "hugo-story"
baseURL = "https://www.wiso.cz"
locale = "en-US"
title = "Martin Wišo"
enableRobotsTXT = true
canonifyURLs = false

## -----------------------------------------------
## Hugo Built-in Features
## -----------------------------------------------

# Keep taxonomy indexes enabled so /tags/ resolves with an index page.

[services]
  [services.googleAnalytics]
    ID = "G-9G56ZYB7VV"
  [services.disqus]
    shortname = "wiso"

## -----------------------------------------------
## Site Parameters
## -----------------------------------------------

[Params]
  description = "Experienced Software Engineer specializing in distributed systems, Erlang/Elixir, and cloud-native development. Based in Berlin, Germany with 25+ years of experience."
  author = "Martin Wišo"
  keywords = ["software engineer", "erlang", "elixir", "golang", "distributed systems", "berlin", "functional programming", "cloud-native"]
  tagline = "Experienced Software Engineer & Technical Lead"
  defaultImage = "/img/headers/profile_portrait.jpg"

[Params.analytics]
  enabled = true
  provider = "ga4"
  consent_required = true

[Params.social]
  email = "martin@wiso.cz"
  github = "https://github.com/tgrk"
  twitter = "https://twitter.com/tajgur"
  linkedin = "https://www.linkedin.com/in/martinwiso/"
  instagram = "https://www.instagram.com/martinwiso/"

[Params.favicon]
  use = true
  logo_jpg = "/img/favicon-32x32.png"
  logo_png = "/img/favicon-32x32.png"
  logo_svg = "/img/android-chrome-192x192.png"

[markup.highlight]
  # Code blocks sit on a dark aubergine panel in both colour schemes.
  style = "dracula"
